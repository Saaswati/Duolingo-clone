# Render blueprint for the backend.
# Push this repo, then "New > Blueprint" on Render and point it here.
services:
  - type: web
    name: duolingo-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Free instances have an ephemeral filesystem, so the demo rebuilds its
      # database on every boot instead of coming back empty. On a paid
      # instance with a persistent disk, set this to false.
      - key: SEED_ON_STARTUP
        value: "true"
      # Replace with your deployed frontend URL once Vercel has given you one.
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000"
